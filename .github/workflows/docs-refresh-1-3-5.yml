name: docs-refresh-1-3-5

on:
  push:
    branches:
      - feat/1-3-5-terminal-pagination-token
    paths:
      - .github/workflows/docs-refresh-1-3-5.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh documentation rollups
        run: npm run docs:ops:refresh
      - name: Check documentation consistency
        run: npm run docs:ops:check
      - name: Commit generated documentation
        run: |
          if git diff --quiet -- docs; then
            echo "No generated documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: refresh task 1.3.5 rollups"
          git push
