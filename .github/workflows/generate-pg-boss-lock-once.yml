name: generate-pg-boss-lock-once

on:
  push:
    branches:
      - feat/2-4-1-schedules

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock pg-boss 12.30.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
