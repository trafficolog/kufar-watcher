name: tdd-2-4-5-task1-unit-red

on:
  push:
    branches:
      - feat/2-4-5-run-degradation-journal
    paths:
      - .github/workflows/tdd-2-4-5-task1-unit-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add Task 1 unit RED assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/unit/cold-start-persistence.test.ts')
          s = p.read_text()
          old = "        errorCode: null,\n        httpStatus: null,\n        degradedLevel: null,\n      },\n    })\n    expect(mocks.runCreate).not.toHaveBeenCalled()"
          new = "        errorCode: null,\n        httpStatus: null,\n      },\n    })\n    expect(mocks.runUpdate.mock.calls[0]?.[0].data).not.toHaveProperty('degradedLevel')\n    expect(mocks.runCreate).not.toHaveBeenCalled()"
          if old not in s:
              raise SystemExit('cold-start anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/unit/scheduled-monitor-run.test.ts')
          s = p.read_text()
          old = "        errorCode: 'http-4xx',\n        httpStatus: 403,\n        degradedLevel: null,\n      },\n    })\n    expect(JSON.stringify(runUpdate.mock.calls)).not.toContain('top-secret')"
          new = "        errorCode: 'http-4xx',\n        httpStatus: 403,\n      },\n    })\n    expect(runUpdate.mock.calls[0]?.[0].data).not.toHaveProperty('degradedLevel')\n    expect(JSON.stringify(runUpdate.mock.calls)).not.toContain('top-secret')"
          if old not in s:
              raise SystemExit('scheduled-run anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/tdd-2-4-5-task1-unit-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/cold-start-persistence.test.ts tests/unit/scheduled-monitor-run.test.ts
          git commit -m "test: require sticky scheduled degradation metadata"
          git push
