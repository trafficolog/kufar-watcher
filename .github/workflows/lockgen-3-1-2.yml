name: lockgen-3-1-2

on:
  push:
    branches:
      - chore/3.1.2-runner-lockgen

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm install @grammyjs/runner@2.0.3 --save-exact
      - run: rm .github/workflows/lockgen-3-1-2.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/lockgen-3-1-2.yml
          git commit -m "chore: add grammY runner dependency"
          git push
