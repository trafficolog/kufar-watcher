name: prettier-supervisor

on:
  push:
    branches:
      - chore/3.1.1-prettier-supervisor

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npx --no-install prettier --write electron/main/worker-supervisor.ts
      - run: rm .github/workflows/prettier-supervisor.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add electron/main/worker-supervisor.ts .github/workflows/prettier-supervisor.yml
          git commit -m "style: format worker supervisor with prettier"
          git push
