name: format-boot-once

on:
  push:
    branches:
      - 'feat/0.1.1-repo-toolchain'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Format boot screen model
        run: npx --yes prettier@3.6.2 --write app/lib/boot-screen-model.ts
      - name: Commit formatted file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/boot-screen-model.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
          else
            git commit -m 'style(0.2.3): format boot screen model'
            git push
          fi
