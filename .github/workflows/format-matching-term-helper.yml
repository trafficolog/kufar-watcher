name: format matching term helper

on:
  push:
    branches:
      - feat/2.7.2-matching-term-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.7.2-matching-term-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Format matcher test and remove helper
        run: |
          npx --no-install prettier --write tests/unit/matching-term.test.ts
          rm .github/workflows/format-matching-term-helper.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/matching-term.test.ts .github/workflows/format-matching-term-helper.yml
          git commit -m "style: apply repository prettier to matching term tests"
          git push origin HEAD:feat/2.7.2-matching-term-contract
