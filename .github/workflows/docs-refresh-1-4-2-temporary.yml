name: docs-refresh-1-4-2-temporary

on:
  push:
    branches:
      - 'feat/1.4.2-cursor-persistence'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh documentation
        run: npm run docs:ops:refresh
      - name: Check documentation
        run: npm run docs:ops:check
      - name: Commit refreshed docs if needed
        run: |
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs(1.4.2): refresh task rollups'
          git push origin HEAD:feat/1.4.2-cursor-persistence
