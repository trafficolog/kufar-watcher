name: format-2-4-4-pause

on:
  push:
    branches:
      - feat/2-4-4-retries
    paths:
      - .github/workflows/format-2-4-4-pause.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2-4-4-retries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci --ignore-scripts
      - name: Format pause-required files
        run: npx --no-install prettier --write electron/worker/scheduled-monitor-run.ts tests/unit/scheduled-monitor-retry-disposition.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add electron/worker/scheduled-monitor-run.ts tests/unit/scheduled-monitor-retry-disposition.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting changes to commit'
            exit 0
          fi
          git commit -m 'style: apply canonical pause-required formatting'
          git push origin HEAD:feat/2-4-4-retries
