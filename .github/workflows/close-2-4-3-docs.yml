name: close-2-4-3-docs

on:
  push:
    branches:
      - feat/2-4-3-run-journal
    paths:
      - .github/workflows/close-2-4-3-docs.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2-4-3-run-journal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci --ignore-scripts
      - name: Update release source docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{path} replacement missing: {old!r}')
                  text = text.replace(old, new, 1)
              file.write_text(text)

          replace_exact('docs/ROADMAP.MD', [
              (
                  'increments `2.4.1–2.4.2` реализованы и прошли verification.',
                  'increments `2.4.1–2.4.3` реализованы и прошли verification.',
              ),
              (
                  'Обязательный scope `0.3.0` содержит 34 task-карточки. Из них 21 закрыта и 13\nостаётся.',
                  'Обязательный scope `0.3.0` содержит 34 task-карточки. Из них 22 закрыты и 12\nостаётся.',
              ),
              ('| Планировщик | `2.4.1–2.4.4` | **2/4 done** |', '| Планировщик | `2.4.1–2.4.4` | **3/4 done** |'),
              ('| **Итого** | **34 задачи** | **21 done / 13 todo** |', '| **Итого** | **34 задачи** | **22 done / 12 todo** |'),
              (
                  '`2.4.1–2.4.2` уже закрыты; актуальный релизный путь продолжается с `2.4.3`:',
                  '`2.4.1–2.4.3` уже закрыты; актуальный релизный путь продолжается с `2.4.4`:',
              ),
              (
                  'NEXT:                                                                 └→ 2.4.3–2.4.4 → 3.1 → 3.2.1–3.2.3',
                  'NEXT:                                                                 └→ 2.4.4 → 3.1 → 3.2.1–3.2.3',
              ),
              (
                  '1. `2.4.1–2.4.2` закрыты; завершить `2.4.3–2.4.4`. Зависимость для старта `5.0.1` уже\n   снята, а после `2.4.3` можно доводить `5.0.3`.',
                  '1. `2.4.1–2.4.3` закрыты; завершить `2.4.4`. Зависимость для старта `5.0.1` уже\n   снята, а `5.0.3` теперь также разблокирована завершённым `2.4.3`.',
              ),
          ])

          replace_exact('docs/releases/v0.3.0.md', [
              (
                  '`2.1`, matcher `2.2`, scheduler registration `2.4.1` и no-overlap `2.4.2` закрыты: 21 из 34\nобязательных task-карточек MVP-1 имеют статус `done`.',
                  '`2.1`, matcher `2.2`, scheduler registration `2.4.1`, no-overlap `2.4.2` и Run journal `2.4.3` закрыты: 22 из 34\nобязательных task-карточек MVP-1 имеют статус `done`.',
              ),
              ('Остаётся закрыть 13 карточек:', 'Остаётся закрыть 12 карточек:'),
              (
                  '- [x] `2.4.1–2.4.2` — persisted pg-boss schedules, restart reconciliation, worker dispatch and per-monitor no-overlap;',
                  '- [x] `2.4.1–2.4.3` — persisted pg-boss schedules, restart reconciliation, per-monitor no-overlap and Run journal;',
              ),
              ('- [ ] `2.4.3–2.4.4` — Run journal / retries;', '- [ ] `2.4.4` — retries / degraded behavior;'),
          ])
          PY
      - run: npm run docs:ops:refresh
      - run: npm run docs:ops:check
      - name: Commit release docs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No docs changes to commit'
            exit 0
          fi
          git commit -m 'docs: advance MVP-1 after run journal'
          git push origin HEAD:feat/2-4-3-run-journal
