name: close-2-3-1

on:
  push:
    branches:
      - 'feat/2.3.1-seller-type-request'

permissions:
  contents: write

jobs:
  close-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.3.1-seller-type-request
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install docs tooling
        run: npm ci --ignore-scripts
      - name: Close 2.3.1 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('docs/superpowers/specs/kufar-api-contract.md')
          text = spec.read_text()
          marker = '### Seller type (`2.3.1`, live recon 2026-09-12)'
          if marker not in text:
              anchor = "Параметры `ar`, `cur`, `cnd`, `otype`/исторический `ot` не входят в минимальный\n"
              insert = '''### Seller type (`2.3.1`, live recon 2026-09-12)\n\nТекущий Search API использует bool-фильтр `company_ad` с URL/API-именем `cmp`.\nLive recon на `rendered-paginated` подтвердил одинаковую семантику для уже\nподдерживаемых electronics и real-estate mappings:\n\n- `cmp=0` и `cmp=false` возвращают только объявления частников\n  (`company_ad=false`);\n- `cmp=1` и `cmp=true` возвращают только объявления компаний\n  (`company_ad=true`);\n- user-layer marker `bez-posrednikov` эквивалентен private-семантике и\n  канонизируется в `SellerType = 'private'`;\n- company-семантика канонизируется в `SellerType = 'company'`;\n- outbound API mapping обязан передавать `cmp=0` для `private` и `cmp=1` для\n  `company`, а не фильтровать уже полученные записи по `company_ad`.\n\nElectronics probe 2026-09-12: baseline `1256`; `cmp=0` -> `802` и 30/30\n`company_ad=false` в первой странице; `cmp=1` -> `454` и 30/30\n`company_ad=true`. Real-estate probe: baseline `12036`; `cmp=0` -> `816` и\n30/30 private; `cmp=1` -> `11222` и 30/30 company. Подтверждающий Actions run:\n`probe-2-3-1-seller-type #3`, run id `34680955449`.\n\nInvalid или конфликтующие повторные `cmp` не являются opaque extras: parser\nдолжен отклонять такой URL как неоднозначную seller semantics.\n\n'''
              if anchor not in text:
                  raise SystemExit('seller contract insertion anchor not found')
              text = text.replace(anchor, insert + anchor, 1)
              spec.write_text(text)

          task = Path('docs/tasks/2-3-1-seller-type-request.md')
          text = task.read_text()
          text = text.replace('status: in_progress', 'status: done', 1)
          text = text.replace('sync_state: drifted', 'sync_state: aligned', 1)
          text = text.replace('> Эпик 2.3 · Фаза 2 · 🟡 in_progress · зависит от: 1.1.2 · оценка: 2-3 ч',
                              '> Эпик 2.3 · Фаза 2 · ✅ done · зависит от: 1.1.2 · оценка: 2-3 ч', 1)
          text = text.replace('- [ ] `CanonicalQuery.sellerType`', '- [x] `CanonicalQuery.sellerType`', 1)
          text = text.replace('- [ ] Parser корректно', '- [x] Parser корректно', 1)
          text = text.replace('- [ ] Invalid/conflicting', '- [x] Invalid/conflicting', 1)
          text = text.replace('- [ ] Listing URL', '- [x] Listing URL', 1)
          text = text.replace('- [ ] API URL', '- [x] API URL', 1)
          text = text.replace('- [ ] Legacy persisted', '- [x] Legacy persisted', 1)
          text = text.replace('- [ ] Новые тесты', '- [x] Новые тесты', 1)
          if '## Результат' not in text:
              result = '''## Результат\n\n- RED: `verify #1034` дошёл до unit suite и дал 12 ожидаемых failures на\n  seller parser/build/persistence contract до production-реализации.\n- GREEN implementation: `verify #1038`, run id `34681646942`, exact SHA\n  `e5b8905e08dd4f1bd7d521a63b833bca44fe1ef8` — dependency audit, docs,\n  483 unit tests, typecheck, lint, formatting, PostgreSQL integration, build и\n  development/production Electron smoke прошли успешно.\n- Compile-time regression выявила дублирующий persisted-query parser в\n  incremental path; он удалён, cold-start и incremental теперь используют общий\n  `parsePersistedCanonicalQuery`, включая legacy normalization.\n\n'''
              text = text.replace('## Не делать\n', result + '## Не делать\n', 1)
          task.write_text(text)

          epic = Path('docs/epics/2-3-seller-filter.md')
          text = epic.read_text()
          text = text.replace(
              'status_note: "Нативный тип продавца в работе; персональный blacklist следует отдельной задачей."',
              'status_note: "Нативный тип продавца закрыт в 2.3.1; персональный blacklist остаётся задачей 2.3.2."',
              1,
          )
          epic.write_text(text)

          next_task = Path('docs/tasks/2-3-2-personal-seller-blacklist.md')
          if not next_task.exists():
              next_task.write_text('''---\nid: "2.3.2"\nphase: 2\nepic: "2.3"\nstatus: todo\nsync_state: drifted\nlast_reviewed: 2026-09-12\nroles: [BACK, DB, QA]\ndepends_on: ["0.3.4", "2.3.1"]\nestimated_hours: 2-3\nagent: backend-senior\ntags: [seller, blacklist, prisma, postfilter, tdd]\n---\n\n# Задача 2.3.2 — Персональный чёрный список аккаунтов\n\n> Эпик 2.3 · Фаза 2 · ⬜ todo · зависит от: 0.3.4, 2.3.1 · оценка: 2-3 ч\n\n## Цель\n\nПрименять персональный `SellerBlock` как локальный post-filter после получения\nвыдачи Kufar, не смешивая blacklist с нативным seller-type request filter.\n\n## Контекст\n\nСхема `SellerBlock` уже добавлена задачей `0.3.4`; search records содержат\n`Listing.accountId`. В runtime incremental pipeline уже есть\n`CandidatePrefilter`, выполняющийся до загрузки полного описания и до matcher-а —\nэто подходящая граница для blacklist без лишних detail requests.\n\n## Что должно быть сделано\n\n- Реализовать Prisma-backed prefilter по `SellerBlock.accountId`.\n- На каждый run читать актуальный набор блокировок один раз и применять его ко\n  всем новым listings этого run.\n- Отбрасывать listing только когда его непустой `accountId` присутствует в\n  `SellerBlock`; `null`/неизвестный account id сам по себе не блокируется.\n- Подключить prefilter к scheduled/incremental runtime до description loading,\n  keyword matching и notification selection.\n- Изменения `SellerBlock` должны вступать в силу со следующего run без restart.\n- Покрыть поведение unit и PostgreSQL integration tests.\n\n## Критерии приёмки\n\n- [ ] Заблокированный `accountId` не проходит в matcher/notification pipeline.\n- [ ] Незаблокированный и `null` account id продолжают обычную обработку.\n- [ ] Blacklist применяется после source response и не меняет Kufar request URL.\n- [ ] Для заблокированных listings не расходуется detail-request budget.\n- [ ] Добавление/удаление `SellerBlock` учитывается на следующем run.\n- [ ] Unit и PostgreSQL integration tests проходят RED → GREEN.\n\n## Не делать\n\n- Не менять native `cmp` seller-type filtering из `2.3.1`.\n- Не добавлять UI управления blacklist — это задача `5.4.5`.\n- Не пытаться передавать account blacklist на Kufar как неподтверждённый query\n  parameter.\n- Не расширять схему `SellerBlock` без отдельного требования.\n''')

          Path('.github/workflows/close-2-3-1.yml').unlink()
          PY
      - name: Refresh generated docs
        run: |
          npm run docs:ops:refresh
          npm run docs:ops:check
      - name: Commit closed task docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs .github/workflows/close-2-3-1.yml
          git commit -m "docs: close seller type request 2.3.1"
          git push
