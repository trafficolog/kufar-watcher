name: prepare-0-4-4

on:
  push:
    branches:
      - 'feat/0.4.4-dependency-advisory-remediation'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: |
          npm install --global npm@11.4.2
          test "$(npm --version)" = "11.4.2"
      - name: Regenerate lockfile with npm 11.4.2
        run: npm install --package-lock-only --ignore-scripts
      - name: Install regenerated dependency graph
        run: npm ci
      - name: Refresh canonical docs rollups
        run: npm run docs:ops:refresh
      - name: Capture generated lockfile and docs
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json docs; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs
          git commit -m "chore: regenerate 0.4.4 lockfile and docs"
          git push
