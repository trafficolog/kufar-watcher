name: refresh-1-4-5-docs

on:
  push:
    branches:
      - feat/1-4-5-checkpoint-recovery
    paths:
      - .github/workflows/refresh-1-4-5-docs.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-4-5-checkpoint-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh generated docs
        run: npm run docs:ops:refresh
      - name: Check docs consistency
        run: npm run docs:ops:check
      - name: Commit docs refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --exit-code && exit 0
          git commit -m "docs: refresh status after 1.4.5"
          git push origin HEAD:feat/1-4-5-checkpoint-recovery
