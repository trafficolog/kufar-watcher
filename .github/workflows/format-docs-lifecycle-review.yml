name: format-docs-lifecycle-review

on:
  push:
    branches:
      - feat/2.7.11-docs-lifecycle-contract
    paths:
      - .github/workflows/format-docs-lifecycle-review.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.7.11-docs-lifecycle-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/docs-ops-check.test.ts
      - name: Commit formatted file and remove helper
        run: |
          rm .github/workflows/format-docs-lifecycle-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/docs-ops-check.test.ts .github/workflows/format-docs-lifecycle-review.yml
          git commit -m "style: format docs lifecycle review tests"
          git push origin HEAD:feat/2.7.11-docs-lifecycle-contract
