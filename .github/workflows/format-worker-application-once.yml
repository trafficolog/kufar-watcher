name: format-worker-application-once

on:
  push:
    branches:
      - feat/2-4-1-schedules

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Format worker application test
        run: npx prettier --write tests/unit/worker-application.test.ts
      - name: Commit formatted test if needed
        shell: bash
        run: |
          if git diff --quiet -- tests/unit/worker-application.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/worker-application.test.ts
          git commit -m "style: format worker application test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
