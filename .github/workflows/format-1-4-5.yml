name: format-1-4-5

on:
  push:
    branches:
      - feat/1-4-5-checkpoint-recovery
    paths:
      - .github/workflows/format-1-4-5.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-4-5-checkpoint-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Apply repository Prettier
        run: |
          npx --no-install prettier --write \
            electron/worker/incremental-monitor-run.ts \
            tests/unit/incremental-monitor-run.test.ts \
            tests/unit/incremental-monitor-recovery.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/worker/incremental-monitor-run.ts tests/unit/incremental-monitor-run.test.ts tests/unit/incremental-monitor-recovery.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m "style: format checkpoint recovery changes"
          git push origin HEAD:feat/1-4-5-checkpoint-recovery
