name: format-3-1-1-review

on:
  push:
    branches:
      - chore/3.1.1-review-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npx --no-install prettier --write electron/main/worker-supervisor.ts electron/worker/runtime.ts shared/runtime.ts tests/worker-runtime.test.ts tests/worker-supervisor.test.ts
      - run: rm .github/workflows/format-3-1-1-review.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Telegram bind error path"
          git push