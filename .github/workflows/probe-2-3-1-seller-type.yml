name: probe-2-3-1-seller-type

on:
  push:
    branches:
      - 'feat/2.3.1-seller-type-request'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current search API
        shell: bash
        run: |
          set -euo pipefail
          electronics='https://api.kufar.by/search-api/v2/search/rendered-paginated?cat=5040&rgn=7&query=ps5&size=30&sort=lst.d&lang=ru'
          realestate='https://api.kufar.by/search-api/v2/search/rendered-paginated?cat=1010&gtsy=country-belarus~province-minsk~locality-minsk&typ=sell&size=30&sort=lst.d&lang=ru'
          for scope in electronics realestate; do
            case "$scope" in
              electronics) base="$electronics" ;;
              realestate) base="$realestate" ;;
            esac
            for variant in baseline cmp0 cmp1; do
              case "$variant" in
                baseline) url="$base" ;;
                cmp0) url="$base&cmp=0" ;;
                cmp1) url="$base&cmp=1" ;;
              esac
              key="${scope}-${variant}"
              status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --user-agent 'KufarMonitor/2.3.1-recon' \
                --output "/tmp/${key}.json" --write-out '%{http_code}' "$url")
              echo "=== ${key} status=${status} ==="
              KEY="$key" STATUS="$status" node <<'NODE'
          const fs = require('node:fs')
          const key = process.env.KEY
          const status = process.env.STATUS
          const raw = fs.readFileSync(`/tmp/${key}.json`, 'utf8')
          const body = JSON.parse(raw)
          const ads = Array.isArray(body.ads) ? body.ads : []
          const company = ads.filter((ad) => ad?.company_ad === true).length
          const privateCount = ads.filter((ad) => ad?.company_ad === false).length
          console.log(JSON.stringify({ key, status, total: body.total ?? null, ads: ads.length, company, private: privateCount }))
          NODE
            done
          done

      - name: Inspect current user-layer seller semantics
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline private cmp0 cmp1; do
            case "$variant" in
              baseline) url='https://www.kufar.by/l/r~minsk/igry-i-pristavki/q~ps5' ;;
              private) url='https://www.kufar.by/l/r~minsk/igry-i-pristavki/bez-posrednikov/q~ps5' ;;
              cmp0) url='https://www.kufar.by/l/r~minsk/igry-i-pristavki/q~ps5?cmp=0' ;;
              cmp1) url='https://www.kufar.by/l/r~minsk/igry-i-pristavki/q~ps5?cmp=1' ;;
            esac
            effective=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user-agent 'KufarMonitor/2.3.1-recon' \
              --output "/tmp/page-${variant}.html" --write-out '%{url_effective}' "$url")
            echo "=== page ${variant} effective=${effective} ==="
            VARIANT="$variant" node <<'NODE'
          const fs = require('node:fs')
          const variant = process.env.VARIANT
          const raw = fs.readFileSync(`/tmp/page-${variant}.html`, 'utf8')
          for (const needle of ['bez-posrednikov', 'cmp', 'company_ad']) {
            const indexes = []
            let from = 0
            while (indexes.length < 4) {
              const index = raw.indexOf(needle, from)
              if (index === -1) break
              indexes.push(index)
              from = index + needle.length
            }
            console.log(JSON.stringify({
              variant,
              needle,
              matches: indexes.map((index) => raw.slice(Math.max(0, index - 120), Math.min(raw.length, index + needle.length + 180)).replace(/\s+/g, ' ')),
            }))
          }
          NODE
          done
