name: format-1-4-2-temporary

on:
  push:
    branches:
      - 'feat/1.4.2-cursor-persistence'
    paths:
      - '.github/workflows/format-1-4-2.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Format persistence integration test
        run: npx prettier --write tests/integration/monitor-run-persistence.test.ts
      - name: Commit formatted test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/monitor-run-persistence.test.ts
          git commit -m 'style(1.4.2): format persistence integration test'
          git push origin HEAD:feat/1.4.2-cursor-persistence
