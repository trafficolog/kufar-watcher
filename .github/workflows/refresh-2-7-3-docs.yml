name: refresh-2-7-3-docs

on:
  push:
    branches:
      - feat/2.7.3-description-budget-terminal

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.7.3-description-budget-terminal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh generated docs and self-clean
        run: |
          npm run docs:ops:refresh
          git rm .github/workflows/refresh-2-7-3-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs .github/workflows/refresh-2-7-3-docs.yml
          git commit -m "docs: close description budget remediation 2.7.3"
          git push origin HEAD:feat/2.7.3-description-budget-terminal
