name: format-run-journal-probe

on:
  push:
    branches:
      - feat/2-4-3-run-journal

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci --ignore-scripts
      - name: Print formatted file
        run: npx prettier tests/integration/run-journal.test.ts
