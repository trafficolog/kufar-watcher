name: grammy-lockgen

on:
  push:
    branches:
      - chore/3.1.1-grammy-lockgen

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/3.1.1-grammy-lockgen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm install grammy@1.46.0 --save-exact --package-lock-only --ignore-scripts
      - run: rm .github/workflows/grammy-lockgen.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/grammy-lockgen.yml
          git commit -m "chore: generate grammY lockfile"
          git push origin HEAD:chore/3.1.1-grammy-lockgen
