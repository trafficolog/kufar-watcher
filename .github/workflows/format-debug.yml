name: format-debug

on:
  push:
    branches:
      - feat/1-4-3-cold-start

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npx prettier --write electron/worker/cold-start-monitor-run.ts electron/worker/cold-start-persistence.ts electron/worker/monitor-cycle.ts tests/unit/cold-start-persistence.test.ts tests/unit/cold-start-traversal.test.ts
      - run: git diff -- electron/worker/cold-start-monitor-run.ts electron/worker/cold-start-persistence.ts electron/worker/monitor-cycle.ts tests/unit/cold-start-persistence.test.ts tests/unit/cold-start-traversal.test.ts
