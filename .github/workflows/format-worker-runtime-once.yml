name: format-worker-runtime-once

on:
  push:
    branches:
      - feat/2-4-1-schedules

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install formatting dependencies
        run: npm ci --ignore-scripts
      - name: Format repository
        run: npx --no-install prettier --write .
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format 2.4.1 changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
