name: docs-refresh-diagnostic

on:
  push:
    branches:
      - feat/3.1.3-telegram-outbox

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Apply docs-ops refresh
        run: |
          npm run docs:ops:refresh
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: refresh generated status"
          git push
