name: docs-refresh-diagnostic

on:
  push:
    branches:
      - feat/3.1.3-telegram-outbox

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Print docs-ops refresh diff
        run: |
          npm run docs:ops:refresh
          git diff -- docs
