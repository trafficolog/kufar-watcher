name: tdd-2-4-5-task1-red

on:
  push:
    branches:
      - feat/2-4-5-run-degradation-journal
    paths:
      - .github/workflows/tdd-2-4-5-task1-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add Task 1 persistence RED tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/monitor-run-persistence.test.ts')
          s = p.read_text()
          old = "    expect(run.degradedLevel).toBe('watermark-catchup')\n  })\n\n  it('promotes the pending watermark and clears checkpoint state on completion', async () => {"
          new = "    expect(run.degradedLevel).toBeNull()\n  })\n\n  it('preserves an existing html-fallback marker when finalizing a scheduled catch-up run', async () => {\n    const running = await prisma.run.create({\n      data: {\n        monitorId: MONITOR_ID,\n        startedAt: new Date('2026-09-08T11:01:00.000Z'),\n        outcome: 'running',\n        degradedLevel: 'html-fallback',\n      },\n    })\n    const persistenceInput = input(incompleteTraversal())\n    persistenceInput.runId = running.id\n\n    await commitMonitorRun(prisma, persistenceInput)\n\n    const run = await prisma.run.findUniqueOrThrow({ where: { id: running.id } })\n    expect(run.outcome).toBe('catchup')\n    expect(run.degradedLevel).toBe('html-fallback')\n  })\n\n  it('promotes the pending watermark and clears checkpoint state on completion', async () => {"
          if old not in s:
              raise SystemExit('expected persistence anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/tdd-2-4-5-task1-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/monitor-run-persistence.test.ts
          git commit -m "test: define run degradation persistence semantics"
          git push
