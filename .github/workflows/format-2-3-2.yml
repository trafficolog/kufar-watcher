name: format-2-3-2

on:
  push:
    branches:
      - feat/2.3.2-personal-seller-blacklist
    paths:
      - .github/workflows/format-2-3-2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - name: Format bounded 2.3.2 files
        run: |
          npx prettier --write \
            electron/worker/monitor-cycle.ts \
            tests/integration/monitor-config-persistence.test.ts \
            tests/unit/monitor-cycle.test.ts \
            tests/unit/seller-block-cycle.test.ts
          rm .github/workflows/format-2-3-2.yml
      - name: Commit formatted files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format seller blacklist increment"
          git push
