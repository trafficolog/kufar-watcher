name: issue-71-stale-fixtures
on:
  push:
    branches: [fix/71-supported-url-validation]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[fixtures-71]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/71-supported-url-validation
      - name: Replace unsupported legacy fixture URL in stale cursor tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/integration/monitor-run-stale-config.test.ts')
          content=path.read_text()
          old="'https://www.kufar.by/l/cars'"
          assert content.count(old)==2, f'Expected exactly 2 stale URLs, found {content.count(old)}'
          path.write_text(content.replace(old,"'https://www.kufar.by/l/r~minsk/igry-i-pristavki/q~replacement'"))
          PY
      - name: Publish fixture correction and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/issue-71-stale-fixtures.yml
          git add tests/integration/monitor-run-stale-config.test.ts
          git diff --cached --check
          git commit -m 'test: use supported URL for stale cursor fixture (#71) [fixtures-71]'
          git push origin HEAD:fix/71-supported-url-validation
