name: Materialize MVP archive feature branch

on:
  push:
    branches: [feat/5-4-1-mvp-archive]
    paths: [scripts/archive-implementation.py.gz]

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize reviewed feature source with exact base anchors
        run: |
          set -euo pipefail
          gunzip -c scripts/archive-implementation.py.gz > /tmp/kufar-archive-implementation.py
          echo 'e7136153b5802ea5abf5a6ac125a72eed7d48e2238d27959308d0eaebe66fb10  /tmp/kufar-archive-implementation.py' | sha256sum -c -
          python3 /tmp/kufar-archive-implementation.py --check .
          python3 /tmp/kufar-archive-implementation.py --apply .
          rm scripts/archive-implementation.py.gz .github/workflows/apply-mvp-archive.yml
      - name: Install dependencies
        run: |
          npm install -g npm@11.4.2
          npm ci
      - name: Format edited files
        run: |
          npx --no-install prettier --write shared/ipc.ts shared/runtime.ts electron/preload/desktop-api.ts electron/main/ipc-router.ts electron/main/index.ts electron/main/worker-supervisor.ts electron/worker/runtime.ts electron/worker/monitor-config-sync.ts electron/worker/worker-application.ts electron/worker/scheduled-monitor-run.ts electron/worker/telegram-outbox-delivery.ts electron/worker/telegram-outbox-delivery-repository.ts app/pages/monitors.vue tests/unit/monitor-archive-state.test.ts
          git diff --check
      - name: Focused archive regression
        run: npm test -- tests/unit/monitor-archive-state.test.ts
      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Publish feature source without temporary workflow or payload
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add reversible monitor archive for MVP acceptance (#72)'
          git push origin HEAD:feat/5-4-1-mvp-archive
