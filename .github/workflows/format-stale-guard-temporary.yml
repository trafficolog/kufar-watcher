name: format-stale-guard-temporary

on:
  push:
    branches:
      - 'feat/1.4.2-cursor-persistence'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Format stale-run guard files
        run: npx prettier --write electron/worker/monitor-run-persistence.ts tests/integration/monitor-run-stale-config.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet -- electron/worker/monitor-run-persistence.ts tests/integration/monitor-run-stale-config.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electron/worker/monitor-run-persistence.ts tests/integration/monitor-run-stale-config.test.ts
          git commit -m 'style(1.4.2): format stale-run guard'
          git push origin HEAD:feat/1.4.2-cursor-persistence
