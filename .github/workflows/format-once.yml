name: format-once

on:
  push:
    branches:
      - 'feat/0.1.1-repo-toolchain'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Format adapter files
        run: |
          npx prettier --write electron/main/dockerode-postgres-adapter.ts tests/dockerode-postgres-adapter.test.ts
          git diff --check
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electron/main/dockerode-postgres-adapter.ts tests/dockerode-postgres-adapter.test.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
          else
            git commit -m 'style(0.2.2): apply Prettier to Dockerode adapter'
            git push
          fi
