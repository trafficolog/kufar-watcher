name: refresh 2.7.2 docs helper

on:
  push:
    branches:
      - feat/2.7.2-matching-term-contract

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.7.2-matching-term-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh docs and format authored markdown
        run: |
          npm run docs:ops:refresh
          npx --no-install prettier --write docs/tasks/2-7-2-matching-term-contract.md docs/superpowers/specs/matching-rules.md
          rm .github/workflows/refresh-2-7-2-docs-helper.yml
      - name: Commit exact docs output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/refresh-2-7-2-docs-helper.yml
          git commit -m "docs: refresh rollups for matching term remediation"
          git push origin HEAD:feat/2.7.2-matching-term-contract
