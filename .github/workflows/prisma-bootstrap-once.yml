name: prisma-bootstrap-once

on:
  push:
    branches:
      - 'feat/0.1.1-repo-toolchain'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install and synchronize lockfile
        run: npm install --ignore-scripts
      - name: Format and validate Prisma schema
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate
      - name: Generate initial migration
        run: |
          rm -rf prisma/migrations/20260906161000_init
          mkdir -p prisma/migrations/20260906161000_init
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > prisma/migrations/20260906161000_init/migration.sql
          test -s prisma/migrations/20260906161000_init/migration.sql
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json prisma/schema.prisma prisma/migrations/20260906161000_init/migration.sql
          if git diff --cached --quiet; then
            echo 'No generated changes required'
          else
            git commit -m 'chore(0.3.1): generate Prisma lockfile and migration'
            git push
          fi
