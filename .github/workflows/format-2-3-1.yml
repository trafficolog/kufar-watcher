name: format-2-3-1

on:
  push:
    branches:
      - 'feat/2.3.1-seller-type-request'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2.3.1-seller-type-request
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Format seller type tests
        run: npx --no-install prettier --write tests/unit/url-build.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- tests/unit/url-build.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/url-build.test.ts
          git commit -m "style: format seller type tests"
          git push
