name: fix-scheduler-doc-identity-once

on:
  push:
    branches:
      - feat/2-4-1-schedules

permissions:
  contents: write

jobs:
  fix-doc-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Align scheduler planning docs with pg-boss-safe queue identity
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('docs/superpowers/plans/2026-09-10-2-4-1-pg-boss-schedules.md'),
              Path('docs/superpowers/specs/2026-09-10-2-4-1-pg-boss-schedules-design.md'),
          ]
          replaced = 0
          for path in paths:
              text = path.read_text()
              count = text.count('monitor-run:')
              if count == 0:
                  raise SystemExit(f'{path}: expected stale monitor-run: references')
              path.write_text(text.replace('monitor-run:', 'monitor-run/'))
              replaced += count
          print(f'replaced {replaced} stale queue identity references')
      - name: Commit aligned planning docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-10-2-4-1-pg-boss-schedules.md docs/superpowers/specs/2026-09-10-2-4-1-pg-boss-schedules-design.md
          git diff --cached --check
          git commit -m "docs: align pg-boss queue identity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
