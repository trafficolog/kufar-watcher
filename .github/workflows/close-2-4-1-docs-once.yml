name: close-2-4-1-docs-once

on:
  push:
    branches:
      - feat/2-4-1-schedules

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Update task rollup sources
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'docs/epics/2-4-scheduler.md',
              'last_reviewed: 2026-09-09',
              'last_reviewed: 2026-09-10',
          )
          replace(
              'docs/epics/2-4-scheduler.md',
              'status_note: "Персональные интервалы обхода."',
              'status_note: "Персональные интервалы: 2.4.1 закрыта, 1/4 задач done; далее no-overlap, Run journal и retries."',
          )

          replace(
              'docs/phases/2-rules-scheduler.md',
              'last_reviewed: 2026-09-05',
              'last_reviewed: 2026-09-10',
          )
          replace(
              'docs/phases/2-rules-scheduler.md',
              'status_note: "Фаза 2: нормализация и маски, матчер, фильтр продавца, pg-boss, догоняющий обход, морфология. Карточки написаны для 2.1, 2.2 и 2.4."',
              'status_note: "Фаза 2: 2.1 и 2.2 закрыты; работа по scheduler начата — 2.4.1 done, эпик 2.4 остаётся открытым 1/4; далее seller filter, scheduler, power/catch-up и morphology."',
          )

          replace(
              'docs/ROADMAP.MD',
              'Фундамент, recon, обязательное для MVP-1 ядро площадки `1.1`, `1.2`,\n`1.3.1–1.3.3`, `1.4`, matching `2.1` и matcher `2.2` реализованы и прошли\nverification.',
              'Фундамент, recon, обязательное для MVP-1 ядро площадки `1.1`, `1.2`,\n`1.3.1–1.3.3`, `1.4`, matching `2.1`, matcher `2.2` и первый scheduler\nincrement `2.4.1` реализованы и прошли verification.',
          )
          replace(
              'docs/ROADMAP.MD',
              'Обязательный scope `0.3.0` содержит 34 task-карточки. Из них 19 закрыты и 15\nостаётся.',
              'Обязательный scope `0.3.0` содержит 34 task-карточки. Из них 20 закрыты и 14\nостаётся.',
          )
          replace(
              'docs/ROADMAP.MD',
              '| Планировщик | `2.4.1–2.4.4` | **0/4 done** |',
              '| Планировщик | `2.4.1–2.4.4` | **1/4 done** |',
          )
          replace(
              'docs/ROADMAP.MD',
              '| **Итого** | **34 задачи** | **19 done / 15 todo** |',
              '| **Итого** | **34 задачи** | **20 done / 14 todo** |',
          )
          replace(
              'docs/ROADMAP.MD',
              'актуальный релизный путь начинается с `2.4`:',
              '`2.4.1` уже закрыта; актуальный релизный путь продолжается с `2.4.2`:',
          )
          replace(
              'docs/ROADMAP.MD',
              '└→ 2.4 → 3.1 → 3.2.1–3.2.3',
              '└→ 2.4.2–2.4.4 → 3.1 → 3.2.1–3.2.3',
          )
          replace(
              'docs/ROADMAP.MD',
              '1. Закрыть `2.4.1–2.4.4`; после `2.4.1` можно параллельно начинать `5.0.1`, а\n   после `2.4.3` — доводить `5.0.3`.',
              '1. `2.4.1` закрыта; завершить `2.4.2–2.4.4`. Зависимость для старта `5.0.1` уже\n   снята, а после `2.4.3` можно доводить `5.0.3`.',
          )

          replace(
              'docs/releases/v0.3.0.md',
              '`2.1` и matcher `2.2` закрыты: 19 из 34 обязательных task-карточек MVP-1 имеют\nстатус `done`.',
              '`2.1`, matcher `2.2` и scheduler registration `2.4.1` закрыты: 20 из 34\nобязательных task-карточек MVP-1 имеют статус `done`.',
          )
          replace(
              'docs/releases/v0.3.0.md',
              'Остаётся закрыть 15 карточек:',
              'Остаётся закрыть 14 карточек:',
          )
          replace(
              'docs/releases/v0.3.0.md',
              '- [ ] `2.4.1–2.4.4` — scheduler / Run journal / retries;',
              '- [x] `2.4.1` — persisted pg-boss schedules, reschedule, restart reconciliation and worker dispatch;\n- [ ] `2.4.2–2.4.4` — no-overlap / Run journal / retries;',
          )
      - name: Refresh generated docs status
        run: npm run docs:ops:refresh
      - name: Check docs consistency
        run: npm run docs:ops:check
      - name: Commit synchronized docs
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "No documentation changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: synchronize 2.4.1 scheduler status"
          git push origin "HEAD:${GITHUB_REF_NAME}"
