name: close-2-4-2-docs-once

on:
  push:
    branches:
      - feat/2-4-2-no-overlap

permissions:
  contents: write

jobs:
  close-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Close 2.4.2 source docs
        shell: python
        run: |
          from pathlib import Path

          def replace(path_str, old, new, count=1):
              path = Path(path_str)
              text = path.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s) of {old!r}, found {actual}')
              path.write_text(text.replace(old, new, count))

          task = 'docs/tasks/2-4-2-no-overlap.md'
          replace(task, 'status: todo', 'status: done')
          replace(task, 'sync_state: drifted', 'sync_state: aligned')
          replace(task, 'last_reviewed: 2026-09-05', 'last_reviewed: 2026-09-10\nstatus_note: "Per-monitor overlap guard реализован в scheduled executor: занятый monitor получает Run(outcome=skipped), разные monitor id не блокируются, lock освобождается в finally. GREEN: verify #804 на a779ee224c14474fe8eaf0afb30a70326fc197b2."')
          replace(task, '> Эпик 2.4 · Фаза 2 · ⬜ todo · зависит от: 2.4.1 · оценка: 2-3 ч', '> Эпик 2.4 · Фаза 2 · ✅ done · зависит от: 2.4.1 · оценка: 2-3 ч')
          replace(task, '- [ ] Два trigger одного монитора не выполняются параллельно', '- [x] Два trigger одного монитора не выполняются параллельно')
          replace(task, '- [ ] Пропущенный trigger виден в журнале', '- [x] Пропущенный trigger виден в журнале')
          replace(task, '- [ ] После ошибки lock освобождается', '- [x] После ошибки lock освобождается')
          replace(task, '## Подсказки', '''## TDD и проверка

- Overlap RED: `verify #801` на `e3ec69281a39b36bf2da11f2de760f635f1dbdfc` — второй trigger того же monitor всё ещё запускал обычный cycle; 419 остальных tests GREEN.
- Первый GREEN: `verify #802` на `872fbbb8758ac7ca54a9d9c2309bce595c9734e7` — overlap пропускается, `Run(outcome=skipped)` записывается, полный pipeline GREEN.
- Release-on-error RED: `verify #803` на `04ee7241d40aae589350821ebb2239213015aa6d` — после ошибки monitor оставался locked; different-monitor concurrency при этом уже GREEN.
- Финальный GREEN: `verify #804` на `a779ee224c14474fe8eaf0afb30a70326fc197b2` — lock освобождается в `finally`; unit/static, PostgreSQL compose integration, build/output и оба Electron smoke GREEN.

## Подсказки''')

          epic = 'docs/epics/2-4-scheduler.md'
          replace(epic, 'status_note: "Персональные интервалы: 2.4.1 закрыта, 1/4 задач done; далее no-overlap, Run journal и retries."', 'status_note: "Персональные интервалы и no-overlap закрыты: 2.4.1–2.4.2 done, 2/4 задач; далее Run journal и retries."')

          phase = 'docs/phases/2-rules-scheduler.md'
          replace(phase, 'status_note: "Фаза 2: 2.1 и 2.2 закрыты; работа по scheduler начата — 2.4.1 done, эпик 2.4 остаётся открытым 1/4; далее seller filter, scheduler, power/catch-up и morphology."', 'status_note: "Фаза 2: 2.1 и 2.2 закрыты; scheduler продвинут до 2.4.1–2.4.2 done, эпик 2.4 остаётся открытым 2/4; далее seller filter, Run journal/retries, power/catch-up и morphology."')

          roadmap = 'docs/ROADMAP.MD'
          replace(roadmap, '`1.3.1–1.3.3`, `1.4`, matching `2.1`, matcher `2.2` и первый scheduler\nincrement `2.4.1` реализованы и прошли verification.', '`1.3.1–1.3.3`, `1.4`, matching `2.1`, matcher `2.2` и первые scheduler\nincrements `2.4.1–2.4.2` реализованы и прошли verification.')
          replace(roadmap, 'Из них 20 закрыты и 14\nостаётся.', 'Из них 21 закрыта и 13\nостаётся.')
          replace(roadmap, '| Планировщик | `2.4.1–2.4.4` | **1/4 done** |', '| Планировщик | `2.4.1–2.4.4` | **2/4 done** |')
          replace(roadmap, '| **Итого** | **34 задачи** | **20 done / 14 todo** |', '| **Итого** | **34 задачи** | **21 done / 13 todo** |')
          replace(roadmap, '`2.4.1` уже закрыта; актуальный релизный путь продолжается с `2.4.2`:', '`2.4.1–2.4.2` уже закрыты; актуальный релизный путь продолжается с `2.4.3`:')
          replace(roadmap, 'NEXT:                                                                 └→ 2.4.2–2.4.4 → 3.1 → 3.2.1–3.2.3', 'NEXT:                                                                 └→ 2.4.3–2.4.4 → 3.1 → 3.2.1–3.2.3')
          replace(roadmap, '1. `2.4.1` закрыта; завершить `2.4.2–2.4.4`. Зависимость для старта `5.0.1` уже', '1. `2.4.1–2.4.2` закрыты; завершить `2.4.3–2.4.4`. Зависимость для старта `5.0.1` уже')

          release = 'docs/releases/v0.3.0.md'
          replace(release, '`2.1`, matcher `2.2` и scheduler registration `2.4.1` закрыты: 20 из 34', '`2.1`, matcher `2.2`, scheduler registration `2.4.1` и no-overlap `2.4.2` закрыты: 21 из 34')
          replace(release, 'Остаётся закрыть 14 карточек:', 'Остаётся закрыть 13 карточек:')
          replace(release, '- [x] `2.4.1` — persisted pg-boss schedules, reschedule, restart reconciliation and worker dispatch;\n- [ ] `2.4.2–2.4.4` — no-overlap / Run journal / retries;', '- [x] `2.4.1–2.4.2` — persisted pg-boss schedules, restart reconciliation, worker dispatch and per-monitor no-overlap;\n- [ ] `2.4.3–2.4.4` — Run journal / retries;')
      - name: Refresh generated docs status
        run: |
          npm run docs:ops:refresh
          npm run docs:ops:check
      - name: Commit docs closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --check
          git commit -m "docs: close scheduler no-overlap task"
          git push origin "HEAD:${GITHUB_REF_NAME}"
