name: docs-refresh-once

on:
  push:
    branches:
      - 'feat/0.1.1-repo-toolchain'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh documentation rollups
        run: |
          npm run docs:ops:refresh
          npm run docs:ops:check
      - name: Commit refreshed documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'No generated documentation changes required'
          else
            git commit -m 'docs: refresh generated task status'
            git push
          fi
