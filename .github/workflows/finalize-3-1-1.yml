name: finalize-3-1-1

on:
  push:
    branches:
      - chore/3.1.1-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run docs:ops:refresh
      - run: npm run format
      - run: npm run docs:ops:check
      - run: rm .github/workflows/finalize-3-1-1.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh and format 3.1.1 artifacts"
          git push