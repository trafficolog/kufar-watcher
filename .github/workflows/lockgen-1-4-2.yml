name: lockgen-1-4-2-temporary

on:
  push:
    branches:
      - 'feat/1.4.2-cursor-persistence'
    paths:
      - '.github/workflows/lockgen-1-4-2.yml'

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Generate package metadata
        run: |
          npm install --package-lock-only --ignore-scripts @prisma/adapter-pg@7.10.0 pg
          npm install --package-lock-only --ignore-scripts --save-dev @types/pg
      - name: Commit npm-generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(1.4.2): add Prisma PostgreSQL adapter dependencies'
          git push origin HEAD:feat/1.4.2-cursor-persistence
