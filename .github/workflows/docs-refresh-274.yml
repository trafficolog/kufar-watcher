name: refresh docs operations for 2.7.4

on:
  push:
    branches:
      - feat/2.7.4-run-lifecycle-integrity
    paths:
      - .github/workflows/docs-refresh-274.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Format authored docs
        run: npx prettier --write docs/tasks/2-7-4-run-lifecycle-integrity.md docs/superpowers/specs/data-model.md
      - name: Refresh generated operations docs
        run: npm run docs:ops:refresh
      - name: Commit refreshed docs and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/docs-refresh-274.yml
          git add docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh operations rollups for 2.7.4"
          git push
