name: refresh-2-7-1-docs

on:
  push:
    branches:
      - feat/2.7.1-scheduler-interval-isolation

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Install dependencies
        run: npm ci
      - name: Refresh docs rollups
        run: npm run docs:ops:refresh
      - name: Commit refreshed docs and remove helper
        shell: bash
        run: |
          rm .github/workflows/refresh-2-7-1-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/refresh-2-7-1-docs.yml
          git commit -m "docs: close scheduler interval remediation 2.7.1"
          git push
