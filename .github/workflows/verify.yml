name: verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: |
          npm install --global npm@11.4.2
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Refresh docs diagnostic
        run: |
          npm run docs:ops:refresh
          git diff -- docs/epics/1-2-http-client.md docs/phases/1-kufar-core.md docs/operations/status/current-state.md docs/operations/status/epics.md docs/operations/status/tasks.md docs/operations/status/phases.md docs/operations/status/drift-report.md
          git diff --exit-code -- docs/epics/1-2-http-client.md docs/phases/1-kufar-core.md docs/operations/status/current-state.md docs/operations/status/epics.md docs/operations/status/tasks.md docs/operations/status/phases.md docs/operations/status/drift-report.md
