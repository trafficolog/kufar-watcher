name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.6.0
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Inspect Electron installation
        shell: bash
        run: |
          {
            echo "ignore-scripts=$(npm config get ignore-scripts)"
            env | grep -E '^(ELECTRON|npm_config_)' || true
            ls -la node_modules/electron || true
            if [[ -f node_modules/electron/path.txt ]]; then
              echo 'path.txt:'
              cat node_modules/electron/path.txt
            else
              echo 'path.txt: MISSING'
            fi
          } | tee /tmp/kufar-electron-install.log
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Verify build outputs
        run: |
          test -f .output/public/index.html
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
      - name: Development launch smoke
        id: dev_smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 30s xvfb-run -a npm run dev > /tmp/kufar-dev.log 2>&1
          status=$?
          set -e
          cat /tmp/kufar-dev.log
          test "$status" -eq 124
          grep -q "starting electron app" /tmp/kufar-dev.log
      - name: Production launch smoke
        id: prod_smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a npm start > /tmp/kufar-prod.log 2>&1
          status=$?
          set -e
          cat /tmp/kufar-prod.log
          test "$status" -eq 124
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics
          path: |
            /tmp/kufar-electron-install.log
            /tmp/kufar-dev.log
            /tmp/kufar-prod.log
          retention-days: 1
      - name: Enforce smoke gates
        if: always()
        run: |
          test "${{ steps.dev_smoke.outcome }}" = success
          test "${{ steps.prod_smoke.outcome }}" = success
