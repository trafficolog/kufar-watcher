name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: |
          npm install --global npm@11.4.2
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Refresh documentation tooling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/docs-ops/cli.ts')
          text = path.read_text()
          text = text.replace('const WHITE = 0, GREY = 1, BLACK = 2', 'const GREY = 1, BLACK = 2')
          path.write_text(text)
          PY
          npx --no-install prettier --write src/docs-ops/cli.ts
          npm run docs:ops:refresh
          npm run docs:ops:check
          if ! git diff --quiet -- src/docs-ops/cli.ts docs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/docs-ops/cli.ts docs
            git commit -m 'docs(0.4.1): refresh planning rollups'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Documentation consistency
        run: npm run docs:ops:check
      - name: Prepare Electron Linux sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Verify build outputs
        run: |
          test -f .output/public/index.html
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
      - name: Development launch smoke
        shell: bash
        run: |
          set +e
          timeout 30s xvfb-run -a npm run dev > /tmp/kufar-dev.log 2>&1
          status=$?
          set -e
          cat /tmp/kufar-dev.log
          test "$status" -eq 124
          grep -q "starting electron app" /tmp/kufar-dev.log
          grep -q "\[worker\] ready" /tmp/kufar-dev.log
      - name: Production launch smoke
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a npm start > /tmp/kufar-prod.log 2>&1
          status=$?
          set -e
          cat /tmp/kufar-prod.log
          test "$status" -eq 124
          grep -q "\[worker\] ready" /tmp/kufar-prod.log
