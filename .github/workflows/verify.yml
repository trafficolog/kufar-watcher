name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm 11.6.0
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
      - name: Bootstrap formatting
        run: npm run format
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Build
        shell: bash
        run: |
          set +e
          script -q -e -c "npm run build" /tmp/kufar-build.log
          status=$?
          set -e
          cat /tmp/kufar-build.log
          exit "$status"
      - name: Verify build outputs
        run: |
          test -f .output/public/index.html
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
      - name: Development launch smoke
        id: dev_smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          script -q -e -c "timeout 30s xvfb-run -a npm run dev" /tmp/kufar-dev.log
          status=$?
          set -e
          cat /tmp/kufar-dev.log
          test "$status" -eq 124
          grep -q "starting electron app" /tmp/kufar-dev.log
      - name: Production launch smoke
        id: prod_smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          script -q -e -c "timeout 20s xvfb-run -a npm start" /tmp/kufar-prod.log
          status=$?
          set -e
          cat /tmp/kufar-prod.log
          test "$status" -eq 124
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-diagnostics
          path: |
            /tmp/kufar-dev.log
            /tmp/kufar-prod.log
          retention-days: 1
      - name: Commit bootstrap artifacts once
        if: always()
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore(0.1.1): normalize formatting and lock dependencies'
            git push
          fi
      - name: Enforce smoke gates
        if: always()
        run: |
          test "${{ steps.dev_smoke.outcome }}" = success
          test "${{ steps.prod_smoke.outcome }}" = success
