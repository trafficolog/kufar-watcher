name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm 11.6.0
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          if [[ -f package-lock.json ]]; then
            npm ci --loglevel verbose
          else
            npm install --loglevel verbose
          fi
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '--- npm debug log ---'
            cat "$HOME"/.npm/_logs/*-debug-0.log || true
            exit "$status"
          fi
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        id: formatting
        continue-on-error: true
        shell: bash
        run: |
          npm run format:check 2>&1 | tee /tmp/kufar-format.log
          status=${PIPESTATUS[0]}
          npx prettier --list-different . > /tmp/kufar-format-files.txt || true
          exit "$status"
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build 2>&1 | tee /tmp/kufar-build.log
      - name: Verify build outputs
        if: steps.build.outcome == 'success'
        run: |
          test -f .output/public/index.html
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
      - name: Development launch smoke
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          timeout 30s xvfb-run -a npm run dev 2>&1 | tee /tmp/kufar-dev.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 124
          grep -q "starting electron app" /tmp/kufar-dev.log
      - name: Production launch smoke
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a npm start 2>&1 | tee /tmp/kufar-prod.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 124
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/kufar-diagnostics
          cp /tmp/kufar-format.log /tmp/kufar-diagnostics/format.log 2>/dev/null || true
          cp /tmp/kufar-format-files.txt /tmp/kufar-diagnostics/format-files.txt 2>/dev/null || true
          cp /tmp/kufar-build.log /tmp/kufar-diagnostics/build.log 2>/dev/null || true
          cp /tmp/kufar-dev.log /tmp/kufar-diagnostics/dev.log 2>/dev/null || true
          cp /tmp/kufar-prod.log /tmp/kufar-diagnostics/prod.log 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics
          path: /tmp/kufar-diagnostics
          retention-days: 1
      - name: Upload generated lockfile
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
      - name: Enforce diagnostic gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.formatting.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
