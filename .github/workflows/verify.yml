name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: kufar_ci_runtime
      POSTGRES_PASSWORD: kufar-ci-runtime-password
      POSTGRES_DB: kufar_ci_runtime
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: |
          npm install --global npm@11.4.2
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit diagnostic
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-all.json
          all_status=$?
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json
          prod_status=$?
          set -e

          node <<'NODE'
          const fs = require('node:fs')

          for (const [label, path] of [
            ['ALL', '/tmp/npm-audit-all.json'],
            ['PROD', '/tmp/npm-audit-prod.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'))
            console.log(`=== npm audit ${label} metadata ===`)
            console.log(JSON.stringify(report.metadata, null, 2))
            console.log(`=== npm audit ${label} vulnerabilities ===`)
            for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                name,
                severity: vulnerability.severity,
                isDirect: vulnerability.isDirect,
                via: vulnerability.via,
                effects: vulnerability.effects,
                range: vulnerability.range,
                nodes: vulnerability.nodes,
                fixAvailable: vulnerability.fixAvailable,
              }, null, 2))
            }
          }
          NODE

          echo "npm audit all exit=$all_status"
          echo "npm audit prod exit=$prod_status"

          node <<'NODE' > /tmp/npm-audit-packages.txt
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-all.json', 'utf8'))
          for (const name of Object.keys(report.vulnerabilities ?? {})) console.log(name)
          NODE

          while IFS= read -r package; do
            echo "=== npm ls $package ==="
            npm ls "$package" --all || true
          done < /tmp/npm-audit-packages.txt
      - name: Documentation consistency
        run: npm run docs:ops:check
      - name: Unit tests
        run: npm test
      - name: CI failure-mode self-check
        run: bash scripts/verify-ci-failure-modes.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Postgres compose integration
        run: bash scripts/verify-postgres-compose.sh
      - name: Prepare Electron Linux sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build
        run: npm run build
      - name: Verify build outputs
        run: |
          test -f .output/public/index.html
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
      - name: Development launch smoke
        shell: bash
        run: |
          set +e
          timeout 30s xvfb-run -a npm run dev > /tmp/kufar-dev.log 2>&1
          status=$?
          set -e
          cat /tmp/kufar-dev.log
          test "$status" -eq 124
          grep -q "starting electron app" /tmp/kufar-dev.log
          grep -q "\[worker\] ready" /tmp/kufar-dev.log
      - name: Production launch smoke
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a npm start > /tmp/kufar-prod.log 2>&1
          status=$?
          set -e
          cat /tmp/kufar-prod.log
          test "$status" -eq 124
          grep -q "\[worker\] ready" /tmp/kufar-prod.log
