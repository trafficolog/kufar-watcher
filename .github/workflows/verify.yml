name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm 11.6.0
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Verify build outputs
        run: |
          test -f .output/public/index.html
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
      - name: Development launch smoke
        shell: bash
        run: |
          set +e
          timeout 30s xvfb-run -a npm run dev 2>&1 | tee /tmp/kufar-dev.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 124
          grep -q "starting electron app" /tmp/kufar-dev.log
      - name: Production launch smoke
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a npm start 2>&1 | tee /tmp/kufar-prod.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 124
      - name: Commit generated lockfile once
        shell: bash
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build(0.1.1): commit npm lockfile'
            git push
          fi
