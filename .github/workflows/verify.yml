name: verify

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: kufar_ci_runtime
      POSTGRES_PASSWORD: kufar-ci-runtime-password
      POSTGRES_DB: kufar_ci_runtime
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: |
          npm install --global npm@11.4.2
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Phase refresh diagnostic
        run: |
          npm run docs:ops:refresh
          git diff -- docs/phases/0-foundation.md
          git diff --exit-code -- docs/phases/0-foundation.md
