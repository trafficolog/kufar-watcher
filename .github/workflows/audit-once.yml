name: audit-once

on:
  push:
    branches:
      - 'feat/0.1.1-repo-toolchain'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11.4.2
        run: npm install --global npm@11.4.2
      - name: Capture npm audit report
        shell: bash
        run: |
          set +e
          npm audit --json | tee /tmp/npm-audit.json
          status=${PIPESTATUS[0]}
          set -e
          echo "audit_exit=$status"
          exit 0
